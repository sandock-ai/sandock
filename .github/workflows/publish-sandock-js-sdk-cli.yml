name: Publish Sandock packages to npm

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/sandock-js/**"
      - "packages/sandock-cli/**"
      - ".github/workflows/publish-sandock-js-sdk-cli.yml"
  workflow_dispatch:

concurrency:
  group: publish-sandock-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish SDK and CLI
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify coordinated versions
        id: versions
        shell: bash
        run: |
          SDK_VERSION=$(node -p "require('./packages/sandock-js/package.json').version")
          CLI_VERSION=$(node -p "require('./packages/sandock-cli/package.json').version")

          if [ -z "$SDK_VERSION" ] || [ "$SDK_VERSION" != "$CLI_VERSION" ]; then
            echo "SDK and CLI versions must match (SDK=$SDK_VERSION, CLI=$CLI_VERSION)"
            exit 1
          fi

          echo "version=$SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing coordinated version $SDK_VERSION"

      - name: Test and build SDK
        run: |
          pnpm --filter sandock exec vitest run
          pnpm --filter sandock build

      - name: Build and smoke test CLI
        run: |
          pnpm --filter sandock-cli build
          node packages/sandock-cli/dist/bin/run.js --help

      - name: Verify packed CLI manifest
        shell: bash
        run: |
          VERSION="${{ steps.versions.outputs.version }}"
          pnpm --filter sandock-cli pack --pack-destination "$RUNNER_TEMP"
          CLI_TARBALL="$RUNNER_TEMP/sandock-cli-$VERSION.tgz"
          PACKED_MANIFEST=$(tar -xOf "$CLI_TARBALL" package/package.json)

          if echo "$PACKED_MANIFEST" | grep -q 'workspace:'; then
            echo "Packed CLI manifest contains a workspace dependency"
            exit 1
          fi

          PACKED_SDK_VERSION=$(echo "$PACKED_MANIFEST" | node -e \
            "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input).dependencies.sandock))")
          if [ "$PACKED_SDK_VERSION" != "^$VERSION" ]; then
            echo "Expected packed sandock dependency ^$VERSION, got $PACKED_SDK_VERSION"
            exit 1
          fi

      - name: Check npm publication state
        id: npm
        shell: bash
        run: |
          VERSION="${{ steps.versions.outputs.version }}"

          if npm view "sandock@$VERSION" version >/dev/null 2>&1; then
            echo "sdk_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "sdk_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if npm view "sandock-cli@$VERSION" version >/dev/null 2>&1; then
            echo "cli_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "cli_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish SDK
        if: steps.npm.outputs.sdk_exists == 'false'
        working-directory: packages/sandock-js
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip existing SDK
        if: steps.npm.outputs.sdk_exists == 'true'
        run: echo "sandock@${{ steps.versions.outputs.version }} already exists; skipping"

      - name: Publish CLI
        if: steps.npm.outputs.cli_exists == 'false'
        working-directory: packages/sandock-cli
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip existing CLI
        if: steps.npm.outputs.cli_exists == 'true'
        run: echo "sandock-cli@${{ steps.versions.outputs.version }} already exists; skipping"

      - name: Create GitHub releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.versions.outputs.version }}"

          if ! gh release view "sandock-js-v$VERSION" >/dev/null 2>&1; then
            gh release create "sandock-js-v$VERSION" \
              --target "$GITHUB_SHA" \
              --title "sandock v$VERSION" \
              --notes "Published sandock@$VERSION to npm."
          fi

          if ! gh release view "sandock-cli-v$VERSION" >/dev/null 2>&1; then
            gh release create "sandock-cli-v$VERSION" \
              --target "$GITHUB_SHA" \
              --title "sandock-cli v$VERSION" \
              --notes "Published sandock-cli@$VERSION to npm."
          fi

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Sandock package publication"
            echo
            echo "- Version: ${{ steps.versions.outputs.version }}"
            echo "- sandock previously published: ${{ steps.npm.outputs.sdk_exists }}"
            echo "- sandock-cli previously published: ${{ steps.npm.outputs.cli_exists }}"
          } >> "$GITHUB_STEP_SUMMARY"
